[project]
name = "kinglet"
version = "0.1.0"

[build]
root = "core/main.kl"
cache_dir = ".kinglet/cache"
out_dir = ".kinglet/out"

[build.compiler]
engine = "ref"
default_backend = "native"

[build.prove]
shadow_root = "core/main.kl"

# Standard library location and implicit imports (ADR 0003).
# Reserved for the prelude wiring (Phase A.3); currently inert — the compiler
# still resolves `using io;` via its native-namespace handling.
[paths]
stdlib = "stdlib"

[prelude]
import = [
  "//stdlib/native/manifest.kl",
]

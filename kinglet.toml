[project]
name = "kinglet"
version = "0.1.0"

[build]
root = "core/main.kl"
cache_dir = ".kinglet/cache"
out_dir = ".kinglet/out"

[build.compiler]
engine = "ref"
default_backend = "native"

[build.prove]
shadow_root = "core/main.kl"

# Standard library location and implicit imports (ADR 0003).
[paths]
stdlib = "stdlib"

[prelude]
import = [
  "//stdlib/native/io.kl",
  "//stdlib/native/fs.kl",
  "//stdlib/native/sys.kl",
]
